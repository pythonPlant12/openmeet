services:
  postgres:
    container_name: openmeet_postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=openmeet
      - POSTGRES_PASSWORD=openmeet_dev
      - POSTGRES_DB=openmeet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmeet"]
      interval: 5s
      timeout: 5s
      retries: 5

  seed:
    container_name: openmeet_seed
    image: postgres:16-alpine
    environment:
      - PGHOST=postgres
      - PGUSER=openmeet
      - PGPASSWORD=openmeet_dev
      - PGDATABASE=openmeet
    volumes:
      - ./openmeet-server/dev/seed.sql:/seed.sql:ro
    command:
      - sh
      - -c
      - until psql -Atqc "SELECT to_regclass('public.conversations')" | grep -qx conversations; do sleep 1; done; psql -v ON_ERROR_STOP=1 -f /seed.sql
    depends_on:
      postgres:
        condition: service_healthy
      sfu:
        condition: service_started

  frontend:
    container_name: openmeet_frontend
    build:
      context: ./openmeet-client
      target: node-base
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - ./openmeet-client:/app
      - /app/node_modules
    environment:
      - VITE_LANDING_PAGE=true
      - VITE_SFU_WSS_URL=ws://localhost:8081/ws
      - VITE_STUN_URL=stun:stun.l.google.com:19302
      - VITE_TURN_URL=turn:${OPENMEET_DEV_HOST_IP:-localhost}:3478
      - VITE_TURN_USER=openmeet
      - VITE_TURN_PASSWORD=openmeet_dev_turn
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    depends_on:
      - sfu
      - coturn

  coturn:
    container_name: openmeet_coturn
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Keep dev media ports below the macOS ephemeral range (49152-65535).
      - "40101-40200:40101-40200/udp"
      - "40101-40200:40101-40200/tcp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=40101"
      - "--max-port=40200"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--user=openmeet:openmeet_dev_turn"
      - "--realm=openmeet.local"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--listening-ip=0.0.0.0"
      - "--external-ip=${OPENMEET_DEV_HOST_IP:-127.0.0.1}"
      - "--allow-loopback-peers"

  rustfs-volume-permissions:
    image: alpine:3.22.1
    volumes:
      - rustfs_data:/data
    command: sh -c "chown -R 10001:10001 /data"

  rustfs:
    container_name: openmeet_rustfs
    image: rustfs/rustfs:1.0.0-rc.5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=openmeet_dev_rustfs
      - RUSTFS_SECRET_KEY=openmeet_dev_rustfs_secret
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  sfu:
    container_name: openmeet_sfu
    image: rust:latest
    working_dir: /app
    ports:
      - "8081:8081"
      - "40000-40100:40000-40100/udp"
    volumes:
      - ./openmeet-server:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    environment:
      - RUST_LOG=info
      - BIND_ADDRESS=0.0.0.0:8081
      - USE_TLS=false
      - STUN_URL=stun:stun.l.google.com:19302
      - TURN_URL=turn:coturn:3478
      - TURN_USER=openmeet
      - TURN_PASSWORD=openmeet_dev_turn
      # Set OPENMEET_DEV_HOST_IP to the reachable host LAN/public IP when testing from phones or other laptops.
      # Without it, remote browsers receive Docker/loopback ICE candidates and media will not connect.
      - PUBLIC_IP=${OPENMEET_DEV_HOST_IP:-}
      - UDP_PORT_MIN=40000
      - UDP_PORT_MAX=40100
      - DATABASE_URL=postgres://openmeet:openmeet_dev@postgres:5432/openmeet
      - JWT_SECRET=dev_secret_change_in_production
      - ACCESS_TOKEN_MINUTES=15
      - REFRESH_TOKEN_DAYS=7
      - RUSTFS_ENDPOINT=http://rustfs:9000
      - RUSTFS_ACCESS_KEY=openmeet_dev_rustfs
      - RUSTFS_SECRET_KEY=openmeet_dev_rustfs_secret
      - RUSTFS_REGION=us-east-1
      - RUSTFS_AVATAR_BUCKET=openmeet-avatars
      - CORS_ALLOWED_ORIGINS=http://localhost:5174,http://127.0.0.1:5174
      - CARGO_TARGET_DIR=/app/target
      # jemalloc: return memory to OS (5 second decay)
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000
    command: sh -c "cargo install cargo-watch && cargo watch -x run"
    depends_on:
      postgres:
        condition: service_healthy
      coturn:
        condition: service_started
      rustfs:
        condition: service_healthy

  # Observability
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  cargo_cache:
  target_cache:
  rustfs_data:
