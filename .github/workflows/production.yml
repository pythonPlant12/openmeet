name: Production

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-client:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: openmeet-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: openmeet-client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: openmeet-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: openmeet-client
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: openmeet-client
        run: pnpm type-check

      - name: Build
        working-directory: openmeet-client
        run: pnpm build

      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Build production image
        run: docker build --target prod openmeet-client

  build-server:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openmeet-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('openmeet-server/Cargo.lock', 'openmeet-server/Cargo.toml') }}

      - name: Check
        working-directory: openmeet-server
        run: cargo check --release

      - name: Build
        working-directory: openmeet-server
        run: cargo build --release

      - name: Build production image
        run: docker build --target prod openmeet-server

  test-client:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: openmeet-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: openmeet-client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: openmeet-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: openmeet-client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: openmeet-client
        run: pnpm lint

      - name: Unit tests
        working-directory: openmeet-client
        run: pnpm test:unit --run

  test-server:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openmeet-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('openmeet-server/Cargo.lock', 'openmeet-server/Cargo.toml') }}

      - name: Run tests
        working-directory: openmeet-server
        run: cargo test

      - name: Check
        working-directory: openmeet-server
        run: cargo check

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-client, test-server]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -T 10 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            set -e

            REPO_DIR=\"/home/debian/openmeet\"
            DEPLOY_BRANCH=\"master\"
            DEPLOY_SHA=\"${{ github.sha }}\"

            if [ ! -d \"\$REPO_DIR/.git\" ]; then
              cd /home/debian
              rm -rf openmeet
              git clone --branch \"\$DEPLOY_BRANCH\" https://github.com/${{ github.repository }}.git openmeet
            else
              cd \$REPO_DIR
            fi

            cd \$REPO_DIR
            git fetch origin \"\$DEPLOY_BRANCH\"
            if [ \"\$(git rev-parse \"origin/\$DEPLOY_BRANCH\")\" != \"\$DEPLOY_SHA\" ]; then
              echo \"Skipping stale deployment for \$DEPLOY_SHA\"
              exit 0
            fi
            git checkout \"\$DEPLOY_BRANCH\"
            git reset --hard \"\$DEPLOY_SHA\"
            git submodule sync --recursive
            git submodule update --init --recursive --force
            chmod +x deploy.sh
            ./deploy.sh
          "

      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 20 --output /dev/null https://openmeets.eu/health
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 20 --output /dev/null https://openmeets.eu/
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 20 --output /dev/null https://sfu.openmeets.eu/health
