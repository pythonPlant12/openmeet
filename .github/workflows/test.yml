# Test Stage

name: Test

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  # Test Client
  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: openmeet-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: openmeet-client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: openmeet-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: openmeet-client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: openmeet-client
        run: pnpm lint

      - name: Unit tests
        working-directory: openmeet-client
        run: pnpm test:unit --run

  # Test Server
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openmeet-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('openmeet-server/Cargo.lock') }}

      - name: Run tests
        working-directory: openmeet-server
        run: cargo test

        # Deep check
      # - name: Clippy
      #   working-directory: openmeet-server
      #   run: cargo clippy -- -D warnings
      
      - name: Check
        working-directory: openmeet-server
        run: cargo check
