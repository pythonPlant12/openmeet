# Build Stage

name: Build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Build Client
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: openmeet-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: openmeet-client/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: openmeet-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: openmeet-client
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: openmeet-client
        run: pnpm type-check

      - name: Build
        working-directory: openmeet-client
        run: pnpm build

      - name: Validate development Compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Build production image
        run: docker build --target prod openmeet-client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: client-build
          path: openmeet-client/dist
          retention-days: 1

  # Build Server
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openmeet-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('openmeet-server/Cargo.lock') }}

      - name: Check
        working-directory: openmeet-server
        run: cargo check --release

      - name: Build
        working-directory: openmeet-server
        run: cargo build --release
